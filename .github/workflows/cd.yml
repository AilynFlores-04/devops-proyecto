name: CD Pipeline - AKS Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Login en Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Conectar a AKS
        run: |
          az aks get-credentials \
            --resource-group rg-devops-academia \
            --name aks-devops \
            --overwrite-existing

      - name: Instalación/Actualización con Helm
        run: |
          helm upgrade --install devops-app helm/devops-app \
            --namespace staging \
            --create-namespace \
            --set image.tag=1.25-alpine \
            --wait --timeout 5m
